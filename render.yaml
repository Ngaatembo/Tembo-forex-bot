services:
  - type: web
    name: tembo-forex-bot-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      # Render injects the private Postgres connection string automatically.
      - key: DATABASE_URL
        fromDatabase:
          name: tembo-forex-bot-db
          property: connectionString
      - key: MARKET_DATA_PROVIDER
        value: mock
      - key: NEWS_PROVIDER
        value: mock
      - key: ECONOMIC_CALENDAR_PROVIDER
        value: mock
      - key: ENABLE_LIVE_EXECUTION
        value: "false"
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:3000,http://localhost:5173

databases:
  - name: tembo-forex-bot-db
    plan: free
