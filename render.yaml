services:
  - type: web
    name: tembo-forex-bot-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      # Everything below is set to a safe, non-secret default in this
      # file. Real secret values (MARKET_DATA_API_KEY, NEWS_API_KEY,
      # ECONOMIC_CALENDAR_API_KEY) are NEVER placed here -- they belong
      # only in Render's dashboard "Environment" tab, entered by hand,
      # never committed to this repository.
      - key: MARKET_DATA_PROVIDER
        value: mock
      - key: NEWS_PROVIDER
        value: mock
      - key: ECONOMIC_CALENDAR_PROVIDER
        value: mock
      - key: ENABLE_LIVE_EXECUTION
        value: "false"
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:3000,http://localhost:5173
