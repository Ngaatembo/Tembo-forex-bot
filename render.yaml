services:
  - type: web
    name: tembo-forex-bot-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      # Render injects the private Postgres connection string automatically.
      - key: DATABASE_URL
        fromDatabase:
          name: tembo-forex-bot-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: MARKET_DATA_PROVIDER
        value: mock
      - key: NEWS_PROVIDER
        value: mock
      - key: ECONOMIC_CALENDAR_PROVIDER
        value: mock
      - key: ENABLE_LIVE_EXECUTION
        value: "false"
      # The current API is GET-only and sends no credentials, so a wildcard
      # keeps the public dashboard usable regardless of its hosting origin.
      # Tighten this to the exact frontend origin when authenticated/write
      # endpoints are introduced.
      - key: CORS_ALLOWED_ORIGINS
        value: "*"

databases:
  - name: tembo-forex-bot-db
    plan: free
