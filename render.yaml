services:
  - type: web
    name: tembo-forex-bot-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      # Render injects the private Postgres connection string automatically.
      - key: DATABASE_URL
        fromDatabase:
          name: tembo-forex-bot-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      # Direct Deriv market data is now the live cockpit source. It covers
      # forex/gold and the existing SYNTH:<symbol> synthetic adapter.
      - key: MARKET_DATA_PROVIDER
        value: deriv
      - key: NEWS_PROVIDER
        value: finnhub
      - key: ECONOMIC_CALENDAR_PROVIDER
        value: finnhub
      - key: ECONOMIC_CALENDAR_API_KEY
        sync: false
      - key: ENABLE_LIVE_EXECUTION
        value: "false"
      - key: ENABLE_PAPER_RUNTIME
        value: "true"
      - key: PAPER_RUNTIME_INTERVAL_SECONDS
        value: "900"
      # Only the deployed Tembo frontend is allowed to call the API.
      - key: CORS_ALLOWED_ORIGINS
        value: "https://tembobot.ngaatendwew.workers.dev"

databases:
  - name: tembo-forex-bot-db
    plan: free
