name: Book Hypothesis Bridge

on:
  workflow_dispatch:
  push:
    paths:
      - "backend/app/research/book_hypotheses.py"
      - "backend/tests/test_book_hypotheses.py"
      - "research/results/book_claim_registry.json"
      - ".github/workflows/book-hypothesis-bridge.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONPATH: ${{ github.workspace }}/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q tests/test_book_hypotheses.py tests/test_hypothesis_registry.py tests/test_hypothesis_provenance.py
      - run: python -c "from app.research.book_hypotheses import build_book_hypotheses; assert len(build_book_hypotheses()) == 5"
