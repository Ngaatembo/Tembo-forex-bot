name: Run Backtest / Analysis

# Trigger manually from the GitHub Actions tab (works fine from phone browser)
on:
  workflow_dispatch:
    inputs:
      script:
        description: 'Path to script/command to run (e.g. python -m app.scripts.backtest_regime)'
        required: true
        default: 'pytest -v'

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run script
        id: run_script
        run: |
          echo "Running: ${{ github.event.inputs.script }}"
          ${{ github.event.inputs.script }} | tee results.txt

      - name: Upload results as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-results
          path: results.txt
